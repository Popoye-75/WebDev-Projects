<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
     <link rel="stylesheet" href="path/to/compiled-style.css">   
    <title>Web Page Calculator</title>
</head>

<body>
    <section class="wrapper">
        <h1>Calculator</h1>
        <div class="calc-body">
            <output class="screen">0</output>
            <div class="btn-sec">
                <div class="btn">
                    <div class="num-btn">
                        <button>(</button>
                        <button>)</button>
                        <button class="delete">Del</button>
                        <button class="all-clear">AC</button>
                        <button>7</button>
                        <button>8</button>
                        <button>9</button>
                        <button>/</button>
                        <button>4</button>
                        <button>5</button>
                        <button>6</button>
                        <button>x</button>
                        <button>1</button>
                        <button>2</button>
                        <button>3</button>
                        <button>-</button>
                        <button>0</button>
                        <button>.</button>
                        <button>=</button>
                        <button>+</button>
                    </div>
                </div>
            </div>
        </div>

    </section>
</body>

</html>
